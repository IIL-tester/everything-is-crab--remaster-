<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everything is Crab</title>
  <style>
    @font-face {
      font-family: 'CrabPixel';
      src: url('https://cdn.jsdelivr.net/gh/IIL-tester/everything-is-crab--remaster-@main/public/fonts/crabpixel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-dark: #141c24;
      --panel-bg: #1e293b;
      --panel-border: #2f2623;
      --panel-highlight: rgba(255, 255, 255, 0.12);
      --crab-orange: #ff6b35;
      --crab-amber: #ffbe0b;
      --hp-red: #ef476f;
      --hp-green: #22c55e;
      --plating-cyan: #4cc9f0;
      --xp-green: #06d6a0;
      --mutagen-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'CrabPixel', monospace;
      color: var(--text-main);
      image-rendering: pixelated;
    }

    #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    canvas#game-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }

    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
    }

    .pointer-auto { pointer-events: auto; }

    .pixel-panel {
      background: rgba(24, 32, 44, 0.94);
      border: 3px solid var(--panel-border);
      box-shadow: 0 4px 0 #0f1318, inset 0 2px 0 var(--panel-highlight);
      padding: 8px 12px;
    }

    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .stats-bars { min-width: 270px; display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .bar-label { width: 66px; color: #cbd5e1; text-transform: uppercase; }
    .bar-track { flex: 1; height: 14px; background: #0f172a; border: 2px solid #2f2623; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.1s linear; }
    .bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; text-shadow: 1px 1px 0 #000; }

    .clock-card { text-align: center; min-width: 340px; }
    .clock-time { font-size: 20px; color: var(--crab-amber); text-shadow: 2px 2px 0 #000; }
    .timeline-track { position: relative; height: 12px; background: #0f172a; border: 2px solid #2f2623; margin: 6px 0 4px 0; }
    .timeline-fill { height: 100%; background: linear-gradient(90deg, #06d6a0, #ffbe0b, #f43f5e); transition: width 0.2s linear; }
    .timeline-marker {
      position: absolute; top: -4px; width: 14px; height: 16px; transform: translateX(-50%);
      background: #1e293b; border: 2px solid #f43f5e; font-size: 9px; line-height: 12px; text-align: center; color: #fda4af;
    }
    .timeline-marker.done { border-color: #06d6a0; color: #06d6a0; }
    .badges-row { display: flex; gap: 6px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 2px 6px; background: #0f172a; border: 2px solid #334155; }

    .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; }
    .ability-strip { display: flex; gap: 6px; flex-wrap: wrap; max-width: 66vw; }
    .ability-slot {
      width: 64px; height: 70px; background: rgba(24, 32, 44, 0.94); border: 3px solid #475569;
      box-shadow: 0 3px 0 #0f1318; display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 4px 3px; position: relative; overflow: hidden;
    }
    .ability-slot.rarity-Common { border-color: #94a3b8; }
    .ability-slot.rarity-Rare { border-color: #38bdf8; }
    .ability-slot.rarity-Epic { border-color: #c084fc; }
    .ability-slot.rarity-Legendary { border-color: #fbbf24; }
    .ability-slot.rarity-Boss { border-color: #f43f5e; }
    .ability-slot-key { position: absolute; top: 2px; left: 3px; font-size: 9px; color: #ffbe0b; z-index: 3; }
    .ability-slot-name { font-size: 9px; text-align: center; line-height: 1.1; z-index: 2; overflow: hidden; max-height: 20px; }
    .ability-slot-lvl { font-size: 10px; color: var(--crab-amber); z-index: 2; }
    .ability-slot-cd { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(239, 71, 111, 0.52); z-index: 1; }

    .minimap-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    canvas#minimap-canvas { border: 3px solid #2f2623; background: #0f172a; image-rendering: pixelated; }

    .modal-overlay {
      position: absolute; inset: 0; background: rgba(10, 15, 22, 0.85);
      display: flex; align-items: center; justify-content: center; z-index: 50; pointer-events: auto;
    }
    .hidden { display: none !important; }
    .modal-box {
      background: #1a2433; border: 4px solid #2f2623; box-shadow: 0 8px 0 #0b0f15, inset 0 3px 0 rgba(255, 255, 255, 0.1);
      padding: 22px 26px; max-width: 960px; width: 94%; max-height: 92vh; overflow-y: auto;
    }
    .modal-title { font-size: 28px; color: var(--crab-amber); text-align: center; text-shadow: 3px 3px 0 #000; margin-bottom: 6px; }
    .modal-subtitle { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 18px; }
    .draft-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .draft-card {
      background: #131b26; border: 3px solid #475569; box-shadow: 0 4px 0 #0b0f15; padding: 14px; cursor: pointer;
      transition: transform 0.1s ease, background 0.1s ease; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    }
    .draft-card:hover { transform: translateY(-3px); background: #233044; }
    .draft-card.rarity-Common { border-color: #94a3b8; }
    .draft-card.rarity-Rare { border-color: #38bdf8; }
    .draft-card.rarity-Epic { border-color: #c084fc; }
    .draft-card.rarity-Legendary { border-color: #fbbf24; }
    .draft-card.rarity-Boss { border-color: #f43f5e; }
    .fact-box { background: rgba(7, 172, 220, 0.1); border-left: 3px solid #07acdc; padding: 6px 8px; font-size: 11px; color: #bae6fd; line-height: 1.35; }

    .btn {
      font-family: 'CrabPixel', monospace; background: #ff6b35; color: #fff; border: 3px solid #2f2623;
      box-shadow: 0 3px 0 #0b0f15, inset 0 2px 0 rgba(255,255,255,0.25); padding: 9px 16px; font-size: 14px; cursor: pointer;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0b0f15; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: #334155; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--crab-amber); margin-bottom: 5px; }
    .form-group select { font-family: 'CrabPixel', monospace; width: 100%; padding: 8px 10px; background: #0f172a; color: var(--text-main); border: 2px solid #475569; font-size: 12px; }
    .boss-banner {
      position: absolute; top: 106px; left: 50%; transform: translateX(-50%);
      background: rgba(24, 16, 22, 0.95); border: 3px solid #f43f5e; box-shadow: 0 4px 0 #0b0f15;
      padding: 8px 18px; min-width: 400px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
  </div>
  <script>
    window.CRAB_ASSET_BASE = 'https://cdn.jsdelivr.net/gh/IIL-tester/everything-is-crab--remaster-@main/public/';
  </script>
  <script src="https://cdn.jsdelivr.net/gh/IIL-tester/everything-is-crab--remaster-@main/cdn/crab.js"></script>
</body>
</html>
